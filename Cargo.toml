[package]
name = "zip-divider"
version = "0.1.0"
edition = "2024"
description = "Split ZIP archives into independently extractable, size-limited ZIP files"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate", "aes-crypto", "bzip2", "zstd", "deflate64", "lzma", "xz", "ppmd"] }
